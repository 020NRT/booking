# Production on your own server (VPS):  see docs/DEPLOY.md
#   1) ./deploy/init-env.sh        -> creates .env with your domain and random secrets
#   2) docker compose up -d --build
# Gives: website + API, PostgreSQL, automatic HTTPS (Caddy) and daily backups.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reserve
      POSTGRES_DB: reserve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserve -d reserve"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://reserve:${POSTGRES_PASSWORD}@db:5432/reserve
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
      CORS_ORIGINS: https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEFAULT_DEPOSIT_KZT: ${DEFAULT_DEPOSIT_KZT:-5000}
      PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-10}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Reserve <no-reply@reserve.kz>}
    volumes:
      - media:/app/backend/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - media:/media:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h db -U reserve -d reserve --format=custom --no-owner -f /backups/reserve-$$ts.dump \
            && tar -czf /backups/reserve-$$ts-media.tar.gz -C /media . \
            && echo "backup $$ts ok"
          find /backups -name 'reserve-*' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
